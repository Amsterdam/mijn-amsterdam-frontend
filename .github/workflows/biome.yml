name: "PR Biome linting, formatting, and import check"
permissions:
  contents: read
  pull-requests: read
on:
  pull_request:
jobs:
  check-biome:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: biomejs/setup-biome@v2
      - name: Check formatting, lint, and imports
        run: biome ci . --error-on-warnings
