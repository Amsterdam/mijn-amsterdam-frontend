name: Biome

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  biome:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: biomejs/setup-biome@v2
      - name: Check formatting, lint, and imports
        run: biome ci . --error-on-warnings
